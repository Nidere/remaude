<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remaude</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <div id="logo">remaude</div>
    <div id="projects"></div>
    <button id="pick-project" title="Открыть системный диалог выбора папки на хосте">📁 добавить проект</button>
    <form id="add-project-form">
      <input id="add-project-path" placeholder="…или путь вручную" spellcheck="false" />
      <button title="Добавить проект">+</button>
    </form>
  </aside>

  <main id="main">
    <header id="header">
      <div id="chat-title">выбери или создай чат</div>
      <div id="header-right">
        <label id="hide-tools-label"><input type="checkbox" id="hide-tools" /> скрыть инструменты</label>
        <select id="permission-mode" title="Режим разрешений">
          <option value="default">спрашивать</option>
          <option value="acceptEdits">правки без вопросов</option>
          <option value="plan">план</option>
          <option value="bypassPermissions">bypass</option>
        </select>
        <div id="limits" title="Лимиты Claude"></div>
        <span id="conn-dot" title="соединение"></span>
      </div>
    </header>

    <div id="feed"></div>

    <footer id="composer">
      <div id="attachments"></div>
      <div id="composer-row">
        <textarea id="input" rows="1" placeholder="Сообщение… (Enter — отправить, Shift+Enter — перенос, Ctrl+V — картинка)"></textarea>
        <button id="stop-btn" title="Прервать" hidden>■</button>
        <button id="send-btn" title="Отправить">➤</button>
      </div>
    </footer>
  </main>

  <div id="picker" hidden>
    <div id="picker-box">
      <div id="picker-title">Папки в <span id="picker-root"></span></div>
      <div id="picker-list"></div>
      <div id="picker-actions"><button id="picker-cancel">Отмена</button></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
