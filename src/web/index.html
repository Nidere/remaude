<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- no viewport-fit=cover: the browser keeps clear of the notch and home bar itself -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>remaude</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#1c1e26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="sidebar-overlay" hidden></div>
  <aside id="sidebar">
    <div id="logo-row">
      <div id="logo">remaude</div>
      <button id="edit-btn" title="Edit sidebar: drag to reorder, rename, remove">✎</button>
      <button id="settings-btn" title="Settings">⚙</button>
    </div>
    <input id="search" placeholder="search chats" spellcheck="false" />
    <div id="projects"></div>
    <div id="search-results"></div>
    <div id="sidebar-footer"></div>
  </aside>

  <main id="main">
    <header id="header">
      <button id="menu-btn" title="Menu">☰</button>
      <div id="chat-title">pick or start a chat</div>
      <div id="header-right">
        <select id="model-select" title="Chat model">
          <option value="">model</option>
          <option value="fable">fable</option>
          <option value="opus">opus</option>
          <option value="sonnet">sonnet</option>
          <option value="haiku">haiku</option>
        </select>
        <select id="effort-select" title="Reasoning effort">
          <option value="">effort</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="xhigh">xhigh</option>
          <option value="max">max</option>
        </select>
        <div id="chat-meta" title="model · effort · context usage"></div>
        <button id="share-btn" title="Share chat (access by email)">🔗</button>
        <label id="hide-tools-label"><input type="checkbox" id="hide-tools" /> hide tools</label>
        <select id="permission-mode" title="Permission mode">
          <option value="bypassPermissions" selected>bypass</option>
          <option value="default">ask</option>
          <option value="acceptEdits">auto-accept edits</option>
          <option value="plan">plan</option>
        </select>
        <button id="att-btn" title="Attachments: images and documents">📎</button>
        <div id="limits" title="Claude limits"></div>
        <span id="conn-dot" title="connection"></span>
      </div>
    </header>

    <div id="feed"></div>
    <button id="scroll-down" title="Jump to latest" hidden>↓</button>

    <div id="activity" hidden><span class="activity-dot"></span><span id="activity-text"></span></div>

    <footer id="composer">
      <div id="attachments"></div>
      <div id="composer-row">
        <button id="attach-btn" title="Attach image">📎</button>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <textarea id="input" rows="1" placeholder="Message…"></textarea>
        <button id="stop-btn" title="Interrupt" hidden>■</button>
        <button id="send-btn" title="Send">➤</button>
      </div>
    </footer>
  </main>

  <div id="share-panel" hidden>
    <div id="share-box">
      <div id="share-head"><span id="share-title">Chat access</span><button id="share-close">✕</button></div>
      <div id="share-warning" hidden></div>
      <div id="share-list"></div>
      <form id="share-form">
        <input id="share-email" type="email" placeholder="email of the person to add" spellcheck="false" />
        <button type="submit">Add</button>
      </form>
      <div id="share-hint">Guests read and write in this chat only. They never see other chats or the file system.</div>
    </div>
  </div>

  <div id="attachments-panel" hidden>
    <div id="att-box">
      <div id="att-head">
        <div id="att-tabs">
          <button class="att-tab active" data-tab="images">🖼 Images</button>
          <button class="att-tab" data-tab="docs">📄 Docs</button>
        </div>
        <div id="att-controls">
          <div class="seg" id="att-scope">
            <button data-value="chat" class="active">this chat</button>
            <button data-value="project">project</button>
          </div>
          <div class="seg" id="att-filter">
            <button data-value="all" class="active">all</button>
            <button data-value="mine">mine</button>
          </div>
          <button id="att-close">✕</button>
        </div>
      </div>
      <div id="att-body"></div>
    </div>
  </div>

  <div id="doc-viewer" hidden>
    <div id="doc-box">
      <div id="doc-head"><span id="doc-title"></span><button id="doc-close">✕</button></div>
      <div id="doc-body" class="md-body"></div>
    </div>
  </div>

  <div id="lightbox" hidden><img alt="" /></div>

  <div id="settings" hidden>
    <div id="settings-box">
      <div id="settings-title">Settings</div>
      <label>Name (message signature)<input id="set-username" spellcheck="false" /></label>
      <label>Projects root<input id="set-root" spellcheck="false" /></label>
      <div id="auth-block">
        <div id="claude-auth-status">Claude account: …</div>
        <div id="claude-login-flow" hidden>
          <a id="claude-login-link" target="_blank" rel="noopener">1. Open the sign-in page →</a>
          <div class="pair-row">
            <input id="claude-login-code" placeholder="2. code from the page" spellcheck="false" />
            <button id="claude-login-send">Submit</button>
          </div>
        </div>
        <button id="claude-login-btn">Sign in to Claude</button>
      </div>
      <div id="relay-block">
        <div id="relay-status">relay: not paired</div>
        <div class="pair-row">
          <input id="set-pair-code" placeholder="code from a new device" spellcheck="false" />
          <button id="pair-btn">Approve</button>
        </div>
      </div>
      <button id="notify-btn" title="Push on permission requests and finished tasks (works via relay, not on localhost)">🔔 Enable notifications</button>
      <div id="notify-status"></div>
      <button id="restart-server" title="Open chats reopen automatically">⟳ Restart server</button>
      <div id="settings-actions">
        <button id="settings-save">Save</button>
        <button id="settings-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="picker" hidden>
    <div id="picker-box">
      <div id="picker-title"></div>
      <div id="picker-list"></div>
      <form id="picker-form" hidden>
        <input id="picker-input" spellcheck="false" />
        <button type="submit">Add</button>
      </form>
      <div id="picker-actions"><button id="picker-cancel">Cancel</button></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
