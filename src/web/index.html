<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remaude</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#1c1e26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="sidebar-overlay" hidden></div>
  <aside id="sidebar">
    <div id="logo-row">
      <div id="logo">remaude</div>
      <button id="settings-btn" title="Настройки">⚙</button>
    </div>
    <input id="search" placeholder="поиск по чатам" spellcheck="false" />
    <div id="projects"></div>
    <button id="pick-project" title="Открыть системный диалог выбора папки на хосте">📁 добавить проект</button>
    <form id="add-project-form">
      <input id="add-project-path" placeholder="…или путь вручную" spellcheck="false" />
      <button title="Добавить проект">+</button>
    </form>
  </aside>

  <main id="main">
    <header id="header">
      <button id="menu-btn" title="Меню">☰</button>
      <div id="chat-title">выбери или создай чат</div>
      <div id="header-right">
        <select id="model-select" title="Модель чата">
          <option value="">модель</option>
          <option value="fable">fable</option>
          <option value="opus">opus</option>
          <option value="sonnet">sonnet</option>
          <option value="haiku">haiku</option>
        </select>
        <select id="effort-select" title="Усилия (reasoning effort)">
          <option value="">усилия</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="xhigh">xhigh</option>
          <option value="max">max</option>
        </select>
        <div id="chat-meta" title="модель · усилия · заполненность контекста"></div>
        <button id="share-btn" title="Поделиться чатом (доступ по почте)">🔗</button>
        <label id="hide-tools-label"><input type="checkbox" id="hide-tools" /> скрыть инструменты</label>
        <select id="permission-mode" title="Режим разрешений">
          <option value="bypassPermissions" selected>bypass</option>
          <option value="default">спрашивать</option>
          <option value="acceptEdits">правки без вопросов</option>
          <option value="plan">план</option>
        </select>
        <div id="limits" title="Лимиты Claude"></div>
        <span id="conn-dot" title="соединение"></span>
      </div>
    </header>

    <div id="feed"></div>
    <button id="scroll-down" title="К свежим сообщениям" hidden>↓</button>

    <footer id="composer">
      <div id="attachments"></div>
      <div id="composer-row">
        <button id="attach-btn" title="Приложить картинку">📎</button>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <textarea id="input" rows="1" placeholder="Сообщение…"></textarea>
        <button id="stop-btn" title="Прервать" hidden>■</button>
        <button id="send-btn" title="Отправить">➤</button>
      </div>
    </footer>
  </main>

  <div id="lightbox" hidden><img alt="" /></div>

  <div id="settings" hidden>
    <div id="settings-box">
      <div id="settings-title">Настройки</div>
      <label>Имя (подпись сообщений)<input id="set-username" spellcheck="false" /></label>
      <label>Корень проектов<input id="set-root" spellcheck="false" /></label>
      <div id="auth-block">
        <div id="claude-auth-status">аккаунт Claude: …</div>
        <div id="claude-login-flow" hidden>
          <a id="claude-login-link" target="_blank" rel="noopener">1. Открыть страницу входа →</a>
          <div class="pair-row">
            <input id="claude-login-code" placeholder="2. код со страницы" spellcheck="false" />
            <button id="claude-login-send">Отправить</button>
          </div>
        </div>
        <button id="claude-login-btn">Войти в Claude</button>
      </div>
      <div id="relay-block">
        <div id="relay-status">relay: не привязан</div>
        <div class="pair-row">
          <input id="set-pair-code" placeholder="код с сайта" spellcheck="false" />
          <button id="pair-btn">Привязать</button>
        </div>
      </div>
      <button id="notify-btn" title="Push при запросах разрешений и завершении задач (работает через remaude.nidere.com)">🔔 Включить уведомления</button>
      <button id="restart-server" title="Живые чаты закроются, вернёшь их через «прошлые чаты»">⟳ Перезапустить сервер</button>
      <div id="settings-actions">
        <button id="settings-save">Сохранить</button>
        <button id="settings-cancel">Отмена</button>
      </div>
    </div>
  </div>

  <div id="picker" hidden>
    <div id="picker-box">
      <div id="picker-title"></div>
      <div id="picker-list"></div>
      <div id="picker-actions"><button id="picker-cancel">Отмена</button></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
